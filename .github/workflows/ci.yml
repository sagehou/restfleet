name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  gateway-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - name: Compile race-enabled isolated channel tests
        run: go test -race -c -o "${RUNNER_TEMP}/gatewaypending.test" ./internal/gatewaypending
      - name: Test material, authority and replay channels across non-root service UIDs
        run: |
          test_dir=$(mktemp -d /tmp/restfleet-isolation.XXXXXX)
          trap 'sudo rm -rf "$test_dir"' EXIT
          chmod 755 "$test_dir"
          install -m 755 "${RUNNER_TEMP}/gatewaypending.test" "$test_dir/gatewaypending.test"
          sudo env RESTFLEET_TEST_CROSS_UID=1 "$test_dir/gatewaypending.test" -test.run='^TestCrossUIDMaterialReplayIsolation$' -test.v -test.count=1 -test.timeout=60s
      - name: Compile race-enabled Gateway service tests
        run: go test -race -c -o "${RUNNER_TEMP}/gateway.test" ./internal/gateway
      - name: Test production Gateway lifecycle across non-root service UIDs and reject root
        run: |
          test_dir=$(mktemp -d /tmp/restfleet-service-isolation.XXXXXX)
          trap 'sudo rm -rf "$test_dir"' EXIT
          chmod 755 "$test_dir"
          install -m 755 "${RUNNER_TEMP}/gateway.test" "$test_dir/gateway.test"
          sudo env RESTFLEET_TEST_SERVICE_ISOLATION=1 "$test_dir/gateway.test" -test.run='^(TestCrossUIDServiceLifecycle|TestServiceStartupRejectsVolatileQueueAndBadTLSWithoutBindingChannels)$' -test.v -test.count=1 -test.timeout=90s

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_DB: restfleet
          POSTGRES_USER: restfleet
          POSTGRES_PASSWORD: test-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U restfleet -d restfleet"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://restfleet:test-only-not-a-secret@localhost:5432/restfleet?sslmode=disable
      RESTFLEET_TEST_DATABASE_URL: postgres://restfleet:test-only-not-a-secret@localhost:5432/restfleet?sslmode=disable

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate Compose deployment
        env:
          RESTFLEET_POSTGRES_MIGRATOR_PASSWORD_FILE: /dev/null
          RESTFLEET_POSTGRES_APP_PASSWORD_FILE: /dev/null
          RESTFLEET_MIGRATOR_DATABASE_URL_FILE: /dev/null
          RESTFLEET_APP_DATABASE_URL_FILE: /dev/null
          RESTFLEET_BOOTSTRAP_TOKEN_FILE: /dev/null
          RESTFLEET_MASTER_KEY_FILE: /dev/null
          RESTFLEET_GRPC_TLS_CERT_FILE: /dev/null
          RESTFLEET_GRPC_TLS_KEY_FILE: /dev/null
          RESTFLEET_SERVER_CA_BUNDLE_FILE: /dev/null
        run: |
          docker compose -f deploy/compose/compose.yaml config --quiet
          docker compose -f deploy/compose/compose.yaml -f deploy/compose/compose.bootstrap.yaml config --quiet
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.1
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Extract pinned central rclone for offline conformance tests
        run: |
          docker create --name restfleet-rclone-conformance rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
          docker cp restfleet-rclone-conformance:/usr/local/bin/rclone "${RUNNER_TEMP}/rclone"
          docker rm restfleet-rclone-conformance
          "${RUNNER_TEMP}/rclone" version
      - name: Extract pinned Restic for offline provisioning tests
        run: |
          docker create --name restfleet-restic-conformance restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
          docker cp restfleet-restic-conformance:/usr/bin/restic "${RUNNER_TEMP}/restic"
          docker rm restfleet-restic-conformance
          "${RUNNER_TEMP}/restic" version
      - run: make generate
      - name: Format Go sources and retain generated source changes
        id: generated
        run: |
          git ls-files -z '*.go' | xargs -0 gofmt -w
          git diff --binary > "${RUNNER_TEMP}/generated-sources.patch"
          if test -s "${RUNNER_TEMP}/generated-sources.patch"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7
        if: steps.generated.outputs.changed == 'true'
        with:
          name: generated-sources
          path: ${{ runner.temp }}/generated-sources.patch
      - name: Verify Gateway service formatting
        run: test -z "$(gofmt -l internal/gateway/service*_linux*.go internal/gateway/conformance_linux_test.go)"
      - run: make lint
      - run: make migrate
      - run: make test
        env:
          RESTFLEET_TEST_RCLONE_BINARY: ${{ runner.temp }}/rclone
          RESTFLEET_TEST_RESTIC_BINARY: ${{ runner.temp }}/restic
      - name: Verify production Gateway audit registration rejects root
        run: |
          go test -race -c -o "${RUNNER_TEMP}/gateway-command.test" ./cmd/restfleet-server
          sudo env RESTFLEET_TEST_DATABASE_URL="$RESTFLEET_TEST_DATABASE_URL" "${RUNNER_TEMP}/gateway-command.test" -test.run='^TestGatewayAuditCommandProductionRootRejected$' -test.v -test.count=1 -test.timeout=60s
      - run: go test -race ./...
        env:
          RESTFLEET_TEST_RCLONE_BINARY: ${{ runner.temp }}/rclone
          RESTFLEET_TEST_RESTIC_BINARY: ${{ runner.temp }}/restic
      - run: make build cross-build
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
      - run: mkdir -p build
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: build/sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/sbom.cdx.json
      - name: Verify generated sources are committed
        run: git diff --exit-code

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: [restfleet-server, restfleet-gateway, restfleet-agent]
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          build-args: COMMAND=${{ matrix.command }}
          platforms: ${{ matrix.platform }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrator-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          target: migrator
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web-dependencies, gateway-isolation, quality, images, migrator-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: restfleet-server
            target: runtime-restfleet-server
          - image: restfleet-gateway
            target: runtime-restfleet-gateway
          - image: restfleet-agent
            target: runtime-restfleet-agent
          - image: restfleet-migrator
            target: migrator
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare image metadata
        id: metadata
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f 1)
          test "$GITHUB_SHA" = "$current_main"
          echo "image=ghcr.io/${IMAGE_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=main-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Containerfile
          target: ${{ matrix.target }}
          build-args: |
            COMMAND=${{ matrix.image }}
            VERSION=${{ steps.metadata.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.metadata.outputs.created }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.metadata.outputs.image }}:main
            ${{ steps.metadata.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.created=${{ steps.metadata.outputs.created }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=publish-${{ matrix.image }}
            type=gha
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}
      - name: Verify published architectures and record digest
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw |
            jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          printf '| Image | Digest |\n| --- | --- |\n| `%s:main` | `%s` |\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
