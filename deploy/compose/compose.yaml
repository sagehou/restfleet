name: restfleet-dev

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: restfleet
      POSTGRES_USER: restfleet_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-migrator-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restfleet_migrator -d restfleet"]
      interval: 2s
      timeout: 3s
      retries: 20
    secrets:
      - postgres-migrator-password
      - postgres-app-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  migrate:
    build:
      context: ../..
      dockerfile: deploy/Containerfile
      target: migrator
    environment:
      RESTFLEET_DATABASE_URL_FILE: /run/secrets/database-url
    secrets:
      - source: migrator-database-url
        target: database-url
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  server:
    build:
      context: ../..
      dockerfile: deploy/Containerfile
      args:
        COMMAND: restfleet-server
    environment:
      RESTFLEET_ENV: development
      RESTFLEET_DATABASE_URL_FILE: /run/secrets/database-url
      RESTFLEET_HTTP_ADDRESS: ":8080"
      RESTFLEET_METRICS_ADDRESS: ":9090"
      RESTFLEET_SECURE_COOKIES: "false"
      RESTFLEET_MASTER_KEY_FILE: /run/secrets/master-key
      RESTFLEET_PUBLIC_URL: "${RESTFLEET_PUBLIC_URL:-https://localhost:8080}"
      RESTFLEET_GRPC_ADDRESS: ":8443"
      RESTFLEET_GRPC_ENDPOINT: "${RESTFLEET_GRPC_ENDPOINT:-localhost:8443}"
      RESTFLEET_GRPC_SERVER_NAME: "${RESTFLEET_GRPC_SERVER_NAME:-localhost}"
      RESTFLEET_GRPC_TLS_CERT_FILE: /run/secrets/grpc-tls-cert
      RESTFLEET_GRPC_TLS_KEY_FILE: /run/secrets/grpc-tls-key
      RESTFLEET_SERVER_CA_BUNDLE_FILE: /run/secrets/server-ca-bundle
    secrets:
      - source: app-database-url
        target: database-url
      - source: master-key
        target: master-key
      - source: grpc-tls-cert
        target: grpc-tls-cert
      - source: grpc-tls-key
        target: grpc-tls-key
      - source: server-ca-bundle
        target: server-ca-bundle
    ports:
      - "${RESTFLEET_HTTP_BIND:-127.0.0.1}:8080:8080"
      - "${RESTFLEET_GRPC_BIND:-127.0.0.1}:8443:8443"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      migrate:
        condition: service_completed_successfully

secrets:
  postgres-migrator-password:
    file: ${RESTFLEET_POSTGRES_MIGRATOR_PASSWORD_FILE:?set RESTFLEET_POSTGRES_MIGRATOR_PASSWORD_FILE}
  postgres-app-password:
    file: ${RESTFLEET_POSTGRES_APP_PASSWORD_FILE:?set RESTFLEET_POSTGRES_APP_PASSWORD_FILE}
  migrator-database-url:
    file: ${RESTFLEET_MIGRATOR_DATABASE_URL_FILE:?set RESTFLEET_MIGRATOR_DATABASE_URL_FILE}
  app-database-url:
    file: ${RESTFLEET_APP_DATABASE_URL_FILE:?set RESTFLEET_APP_DATABASE_URL_FILE}
  master-key:
    file: ${RESTFLEET_MASTER_KEY_FILE:?set RESTFLEET_MASTER_KEY_FILE}
  grpc-tls-cert:
    file: ${RESTFLEET_GRPC_TLS_CERT_FILE:?set RESTFLEET_GRPC_TLS_CERT_FILE}
  grpc-tls-key:
    file: ${RESTFLEET_GRPC_TLS_KEY_FILE:?set RESTFLEET_GRPC_TLS_KEY_FILE}
  server-ca-bundle:
    file: ${RESTFLEET_SERVER_CA_BUNDLE_FILE:?set RESTFLEET_SERVER_CA_BUNDLE_FILE}
volumes:
  postgres-data:
