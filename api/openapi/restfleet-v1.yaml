openapi: 3.1.0
info:
  title: RestFleet API
  version: 0.1.0
  description: RestFleet V1 contract.
servers:
  - url: /
security:
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Required dependencies are ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/bootstrap/status:
    get:
      operationId: bootstrapStatus
      security: []
      responses:
        "200":
          description: Whether the first administrator must be created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapStatus"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/bootstrap:
    post:
      operationId: bootstrap
      security: []
      parameters:
        - name: X-RestFleet-Bootstrap-Token
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BootstrapRequest"
      responses:
        "201":
          description: First administrator and authenticated session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated session created.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and cookies cleared.
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/session:
    get:
      operationId: session
      responses:
        "200":
          description: Current authenticated session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/dashboard/summary:
    get:
      operationId: dashboardSummary
      responses:
        "200":
          description: Empty-capable control-plane summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/version:
    get:
      operationId: version
      responses:
        "200":
          description: Build and compatible schema version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: restfleet_session
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  responses:
    Problem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    BootstrapStatus:
      type: object
      additionalProperties: false
      required: [bootstrap_required]
      properties:
        bootstrap_required:
          type: boolean
    BootstrapRequest:
      type: object
      additionalProperties: false
      required: [username, display_name, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
          pattern: "^[A-Za-z0-9._-]+$"
        display_name:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 12
          maxLength: 1024
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 1024
    Session:
      type: object
      additionalProperties: false
      required: [user, idle_expires_at, absolute_expires_at]
      properties:
        user:
          $ref: "#/components/schemas/User"
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
    User:
      type: object
      additionalProperties: false
      required: [id, username, display_name, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        display_name:
          type: string
        role:
          type: string
          enum: [ADMIN, VIEWER]
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [collected_at, hosts, plans, repositories, operations]
      properties:
        collected_at:
          type: string
          format: date-time
        hosts:
          type: integer
          format: int64
          minimum: 0
        plans:
          type: integer
          format: int64
          minimum: 0
        repositories:
          type: integer
          format: int64
          minimum: 0
        operations:
          type: integer
          format: int64
          minimum: 0
    Version:
      type: object
      additionalProperties: false
      required: [version, commit, built_at, schema_version]
      properties:
        version:
          type: string
        commit:
          type: string
        built_at:
          type: string
        schema_version:
          type: integer
          minimum: 0
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: object
          additionalProperties:
            type: string
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
