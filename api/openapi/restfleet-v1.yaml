        remote_name: { type: string, pattern: "^[A-Za-z][A-Za-z0-9_-]{1,63}$" }
        status: { type: string, enum: [UNTESTED, HEALTHY, DEGRADED, EXPIRED, DISABLED] }
        secret_revision: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
