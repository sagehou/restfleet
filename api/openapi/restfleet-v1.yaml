components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: restfleet_session
  parameters:
    HostId:
      name: host_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AgentId:
      name: agent_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TokenId:
      name: token_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: '^"?[1-9][0-9]*"?$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 4096
  responses:
    Problem:
      description: RFC 9457 problem response.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Repository:
      type: object
      additionalProperties: false
      required: [id, name, host_id, storage_credential_id, status, gateway_secret_revision, restic_secret_revision, revision, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        host_id: { type: string, format: uuid }
        storage_credential_id: { type: string, format: uuid }
        status: { type: string, enum: [PROVISIONING, READY, DEGRADED, LOCKED, DISABLED, ERROR], description: "Availability view. READY requires initialization, current Agent ACK, live matching authorization and a verified Gateway backend observation less than ten minutes old; revision tracks configuration only." }
        format_version: { type: integer, minimum: 2, maximum: 2, description: Absent until verified by the central initialization worker. }
        initialized_at: { type: string, format: date-time }
        last_initialize_operation_id: { type: string, format: uuid }
        agent_credential_revision: { type: integer, format: int64, minimum: 1, description: Current delivery revision for the active Agent; not a Gateway session grant. }
        agent_credential_accepted_at: { type: string, format: date-time, description: Durable credential ACK only; does not imply Repository READY. }
        gateway_secret_revision: { type: integer, format: int64, minimum: 1 }
        restic_secret_revision: { type: integer, format: int64, minimum: 1 }
        revision: { type: integer, format: int64, minimum: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RepositoryList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Repository" }
        next_cursor: { type: string }
    RepositoryCreate:
      type: object
      additionalProperties: false
      required: [name, host_id, storage_credential_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        host_id: { type: string, format: uuid }
        storage_credential_id: { type: string, format: uuid }
        shared: { type: boolean, default: false, description: true is rejected with 409 SHARED_REPOSITORY_NOT_SUPPORTED in V1. }
    TemplateConfig:
      type: object
      additionalProperties: false
      required: [paths, schedule_cron, schedule_timezone]
      properties:
        paths:
          type: array
          minItems: 1
          items: { type: string, minLength: 1, maxLength: 1024 }
        exclude_patterns:
          type: array
          items: { type: string, maxLength: 1024 }
        exclude_caches: { type: boolean, default: false }
        one_file_system: { type: boolean, default: false }
        schedule_cron: { type: string, minLength: 1, maxLength: 128, description: Standard five-field cron in the template timezone. }
        schedule_timezone: { type: string, minLength: 1, maxLength: 64, description: IANA timezone name. }
        jitter_seconds: { type: integer, minimum: 0, maximum: 3600, default: 0 }
        misfire_grace_seconds: { type: integer, minimum: 0, maximum: 86400, default: 900 }
        retry_policy: { type: object, additionalProperties: true, description: Opaque retry metadata stored verbatim for the Agent scheduler. }
        retention_policy_id: { type: string, format: uuid }
        pre_hook_ids:
          type: array
          items: { type: string, format: uuid }
        post_hook_ids:
          type: array
          items: { type: string, format: uuid }
        resource_limits: { type: object, additionalProperties: true, description: Opaque resource limits stored verbatim for the Agent runtime. }
        enabled_by_default: { type: boolean, default: true }
    Template:
      type: object
      additionalProperties: false
      required: [id, name, description, revision, config, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        revision: { type: integer, format: int64, minimum: 1, description: Current immutable revision. Plans apply it explicitly. }
        config: { $ref: "#/components/schemas/TemplateConfig" }
        archived_at: { type: string, format: date-time, description: Set once the template is archived; archived templates cannot receive revisions.
        }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TemplateList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Template" }
        next_cursor: { type: string }
    TemplateCreate:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: string, maxLength: 1024 }
        config: { $ref: "#/components/schemas/TemplateConfig" }
    TemplateUpdate:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 1024 }
