        status: { type: string, enum: [APPLIED, CONFLICT] }
        code: { type: string, description: "Conflict reason: NOT_FOUND, PLAN_ARCHIVED, NOT_USING_TEMPLATE or REVISION_CONFLICT." }
    BackupOperation:
      type: object
