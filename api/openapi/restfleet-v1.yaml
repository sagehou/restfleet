        name: { type: string, minLength: 1, maxLength: 128 }
        host_id: { type: string, format: uuid }
        agent_id: { type: string, format: uuid }
        repository_id: { type: string, format: uuid }
        template_id: { type: string, format: uuid }
        template_revision: { type: integer, format: int64, minimum: 1 }
        overrides: { type: object, additionalProperties: true, description: Allowed JSON merge-patch subset applied over the template revision. }
    PlanUpdate:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 128 }
        template_revision: { type: integer, format: int64, minimum: 1 }
