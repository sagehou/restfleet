        repository_id: { type: string, format: uuid }
        type: { type: string, enum: [CREDENTIAL_TEST, REPOSITORY_INITIALIZE, SNAPSHOT_LIST] }
        status: { type: string, enum: [QUEUED, DISPATCHED, ACKNOWLEDGED, RUNNING, SUCCEEDED, SUCCEEDED_WITH_WARNINGS, FAILED, CANCEL_REQUESTED, CANCELED, TIMED_OUT, LOST, REJECTED] }
        source: { type: string, enum: [USER, SYSTEM] }
        storage_credential_id: { type: string, format: uuid }
        secret_revision: { type: integer, format: int64, minimum: 1 }
        requested_by_user_id: { type: string, format: uuid, nullable: true }
        attempt: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
        dispatched_at: { type: string, format: date-time }
        acknowledged_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        error_code: { type: string, enum: ["", CONNECTION_FAILED, TEST_TIMED_OUT, CONFIG_UNSAFE, REFRESH_FAILED, CREDENTIAL_CHANGED, CREDENTIAL_DISABLED, SECRET_UNAVAILABLE, WORKER_LOST, INITIALIZE_FAILED, INITIALIZE_TIMED_OUT, REPOSITORY_LOCKED, REPOSITORY_MISMATCH, REPOSITORY_NOT_EMPTY, PASSWORD_REJECTED, REPOSITORY_UNAVAILABLE, SNAPSHOT_NOT_FOUND, PATH_INVALID, SCAN_FAILED, SCAN_TIMED_OUT, INDEX_FAILED, INDEX_TIMED_OUT] }
