        source: { type: string, enum: [SCHEDULED, MANUAL] }
        status: { type: string, enum: [QUEUED, RUNNING, SUCCEEDED, SUCCEEDED_WITH_WARNINGS, FAILED, CANCEL_REQUESTED, CANCELED, LOST, MISSED, CONCURRENCY_SKIPPED] }
        plan_revision: { type: integer, format: int64, minimum: 1 }
        scheduled_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        exit_code: { type: integer }
        error_code: { type: string }
        snapshot_id: { type: string }
        files_done: { type: integer, format: int64, minimum: 0 }
        total_files: { type: integer, format: int64, minimum: 0 }
        bytes_done: { type: integer, format: int64, minimum: 0 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        parent_operation_id: { type: string, format: uuid }
        root_operation_id: { type: string, format: uuid }
        cancel_requested_at: { type: string, format: date-time }
