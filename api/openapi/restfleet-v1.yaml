        used_by_agent_id: { type: string, format: uuid }
        revoked_at: { type: string, format: date-time }
    EnrollmentTokenList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/EnrollmentToken" }
    AgentEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [token, csr_pem, install_id, agent_version, protocol_version, hostname, os, arch, capabilities]
      properties:
        token: { type: string, minLength: 1, maxLength: 128 }
        csr_pem: { type: string, minLength: 1, maxLength: 16384 }
        install_id: { type: string, format: uuid }
        agent_version: { type: string, minLength: 1, maxLength: 64 }
        protocol_version: { type: string, minLength: 1, maxLength: 16 }
        hostname: { type: string, minLength: 1, maxLength: 255 }
        os: { type: string, enum: [linux] }
        arch: { type: string, enum: [amd64, arm64] }
        capabilities:
          type: array
          maxItems: 64
          items: { type: string, maxLength: 64 }
    AgentEnrollmentResponse:
      type: object
      additionalProperties: false
      required: [agent_id, host_id, certificate_pem, ca_bundle_pem, not_after, server_name, grpc_endpoint, heartbeat_interval_seconds]
      properties:
        agent_id: { type: string, format: uuid }
        host_id: { type: string, format: uuid }
        certificate_pem: { type: string }
        ca_bundle_pem: { type: string }
        not_after: { type: string, format: date-time }
        server_name: { type: string }
        grpc_endpoint: { type: string }
        heartbeat_interval_seconds: { type: integer, minimum: 1 }
    AgentRevoke:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 512 }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, request_id]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        request_id:
          type: string
          format: uuid
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"
    FieldError:
      type: object
      additionalProperties: false
      required: [field, code]
      properties:
        field:
          type: string
        code:
          type: string
